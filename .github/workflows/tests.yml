# Builds NIS and runs the tests that do not need the nuclear data.
# The nuclear data (git lfs, about 1 GB) is not downloaded, so the tests that need it skip.
# Run those on your machine: uv run pytest src/tests/python/testsuite.py
name: tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Cache the dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: dependencies
          key: deps-${{ runner.os }}-${{ hashFiles('docker/setup_local_deps.sh') }}

      - name: Get the dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash docker/setup_local_deps.sh

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: C++ tests
        run: ./build/bin/nistests

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: dependencies
          key: deps-${{ runner.os }}-${{ hashFiles('docker/setup_local_deps.sh') }}

      - name: Get the dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash docker/setup_local_deps.sh

      - uses: astral-sh/setup-uv@v6

      - name: Build and install pynis
        run: uv sync

      - name: Python tests (fast)
        run: uv run pytest -v -m "not slow" src/tests/python/testsuite.py
