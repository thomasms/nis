variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: none
  GET_SOURCES_ATTEMPTS: 3
  DOCKER_TLS_CERTDIR: ""
  RUNNER_TAG: docker
  DOCKER_BASE_REPO: docker.oecd-nea.org/stainer_t/nis

stages:
  - build
  - test


build_ubuntu:
  stage: build
  image: ${DOCKER_BASE_REPO}:dev
  script:
    - mv /dependencies ./dependencies
    - mkdir build
    - cd build
    - cmake -DCMAKE_BUILD_TYPE=Release ..
    - make -j2
  artifacts:
    paths:
    - build/bin
    expire_in: 1 day
    when: always
  tags:
    - docker

build_ubuntu_debug:
  stage: build
  image: ${DOCKER_BASE_REPO}:dev
  script:
    - mv /dependencies ./dependencies
    - mkdir build_debug
    - cd build_debug
    - cmake -DCMAKE_BUILD_TYPE=Debug ..
    - make -j2
  artifacts:
    paths:
    - build_debug/bin
    expire_in: 1 day
    when: always
  tags:
    - docker

build_python311:
  stage: build
  image: ${DOCKER_BASE_REPO}:dev
  script:
    - mv /dependencies ./dependencies
    - mkdir build
    - cd build
    - cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_PY_API=ON -Dpybind11_DIR=`pybind11-config --cmakedir` ..
    - make -j2
  artifacts:
    paths:
    - build/bin
    expire_in: 1 day
    when: always
  tags:
    - docker

# C++ tests
test_ubuntu:
  stage: test
  image: ${DOCKER_BASE_REPO}:dev
  needs:
  - job: build_ubuntu
    artifacts: true
  script:
    - ./build/bin/nistests
  tags:
    - docker

# python level tests
# for integration testing
test_python:
  stage: test
  image: ${DOCKER_BASE_REPO}:dev
  needs:
  - job: build_python311
    artifacts: true
  before_script:
    # get the data from the package repository
    - "wget --ca-certificate=/ca.crt --header 'PRIVATE-TOKEN: $CI_JOB_TOKEN' https://git.oecd-nea.org/api/v4/projects/${CI_PROJECT_ID}/packages/generic/jeff/311/data.dec"
    - mkdir -p data
    - mv data.dec data.dec data/jeff311.dec
  script:
    - export PYTHONPATH=./build/bin/python3:./src/tests/python
    - pytest -v src/tests/python/testsuite.py
  tags:
    - docker