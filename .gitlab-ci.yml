variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: none
  GET_SOURCES_ATTEMPTS: 3
  DOCKER_TLS_CERTDIR: ""
  RUNNER_TAG: docker
  DOCKER_BASE_REPO: docker.oecd-nea.org/stainer_t/nis

stages:
  - build
  - test


build_ubuntu:
  stage: build
  image: ${DOCKER_BASE_REPO}:dev
  script:
    - mv /dependencies ./dependencies
    - mkdir build
    - cd build
    - cmake -DCMAKE_BUILD_TYPE=Release ..
    - make -j2
  artifacts:
    paths:
    - build/bin
    expire_in: 1 day
    when: always
  tags:
    - docker

build_ubuntu_debug:
  stage: build
  image: ${DOCKER_BASE_REPO}:dev
  script:
    - mv /dependencies ./dependencies
    - mkdir build_debug
    - cd build_debug
    - cmake -DCMAKE_BUILD_TYPE=Debug ..
    - make -j2
  artifacts:
    paths:
    - build_debug/bin
    expire_in: 1 day
    when: always
  tags:
    - docker

test_ubuntu:
  stage: test
  image: ${DOCKER_BASE_REPO}:dev
  needs:
  - job: build_ubuntu
    artifacts: true
  script:
    - ./build/bin/nistests
  tags:
    - docker
